version: '3.9'

name: rtspt

services:
  app:
    build: .
    environment:
      SECRET_KEY_BASE: "$(openssl rand -hex 64)"
    env_file:
      - .env
    ports:
      - 4000:4000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  network:
    driver: bridge